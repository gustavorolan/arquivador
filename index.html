<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquivador</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M10 22h16l4 5h24v22H10z' fill='%23fff'/%3E%3Crect x='30' y='27' width='4' height='22' fill='%231d4ed8'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#17202a;--mut:#667085;--bd:#e1e6ec;--ac:#2563eb;--ac2:#1d4ed8;--ok:#15803d;--er:#b91c1c;--chip:#eaf1ff}
@media(prefers-color-scheme:dark){:root{--bg:#101316;--card:#181c20;--tx:#e8ebee;--mut:#94a0ab;--bd:#272d33;--ac:#5b8def;--ac2:#4a7ae0;--ok:#4ade80;--er:#f87171;--chip:#1c2740}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
header svg{width:40px;height:40px;flex:none}
h1{font-size:22px;margin:0}
h2{font-size:15px;margin:0 0 10px}
.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{background:var(--ac2)}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.sec:hover{background:var(--chip)}
button.perigo{color:var(--er);border-color:var(--er)}
button:disabled{opacity:.5;cursor:default}
select,input[type=text]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit}
input[type=text]{width:100%}
.item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border-bottom:0}
.info{flex:1;min-width:0}
.nome{font-weight:600;overflow-wrap:anywhere}
.ori{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--mut);font-size:13px}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.badge{display:inline-block;background:var(--chip);color:var(--ac);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;margin-left:8px;vertical-align:1px}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--ac);transition:width .3s}
.ok{color:var(--ok)}.er{color:var(--er)}
.vazio{color:var(--mut);padding:6px 0}
.marca{width:18px;height:18px;flex:none;accent-color:var(--ac);cursor:pointer}
.lote{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--chip);border-radius:10px;padding:10px 12px;margin:4px 0 8px}
.lote[hidden]{display:none}
.lote .qtd{font-weight:600;margin-right:4px}
@media(max-width:640px){.item{flex-wrap:wrap}.acoes{justify-content:flex-start;width:100%}}
</style>
</head>
<body>
<main>
<header>
<svg viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1e40af"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M10 20h15l4 5h25v25H10z" fill="#fff"/><rect x="29" y="25" width="6" height="25" fill="#dbeafe"/><g fill="#2563eb"><rect x="26" y="27" width="6" height="3"/><rect x="32" y="33" width="6" height="3"/><rect x="26" y="39" width="6" height="3"/></g><rect x="28" y="44" width="8" height="9" rx="2" fill="#1e40af"/></svg>
<div><h1>Arquivador</h1><div class="mut" id="topo"></div></div>
</header>

<section class="card">
<h2>Compactar</h2>
<div class="row"><select id="raiz"></select><button class="sec" id="btnVarrer">Listar tamanhos</button><span class="mut" id="statusVarrer"></span></div>
<div id="sugestoes"></div>
<div class="row" style="margin-top:12px"><input type="text" id="caminho" placeholder="ou cole um caminho completo, ex.: D:\projetos\antigo"></div>
<div class="row" style="margin-top:12px"><label><input type="checkbox" id="apagar" checked> apagar o original depois de verificar o ZIP</label><button id="btnCompactar">Compactar</button></div>
<div id="msg" class="er" style="margin-top:8px"></div>
</section>

<section class="card">
<h2>Em andamento</h2>
<div id="jobs" class="mut">Nada em andamento.</div>
</section>

<section class="card">
<h2>Arquivados <span class="mut" id="contagem"></span></h2>
<input type="text" id="filtro" placeholder="Filtrar por nome" style="margin-bottom:8px">
<div class="lote" id="lote" hidden>
<span class="qtd" id="qtdMarcadas"></span>
<button id="btnAbrirLote">Abrir marcadas</button>
<button class="sec" id="btnPastasLote">Abrir pastas</button>
<button id="btnGuardarLote">Guardar marcadas de volta</button>
<button class="sec perigo" id="btnExcluirLote">Excluir marcadas</button>
<button class="sec" id="btnLimparLote">Limpar seleção</button>
<span class="er" id="msgLote"></span>
</div>
<div id="itens"></div>
</section>
</main>
<script>
const T="__TOKEN__";
const $=i=>document.getElementById(i);
const tam=b=>b>=1073741824?(b/1073741824).toFixed(2)+" GB":b>=1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataBr=iso=>iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4);
let itensAtuais=[];
const marcados=new Set();
async function api(u,corpo){
 const r=await fetch(u,{method:corpo?"POST":"GET",headers:{"X-Token":T,"Content-Type":"application/json"},body:corpo?JSON.stringify(corpo):undefined});
 const j=await r.json();if(!r.ok)throw new Error(j.erro||r.status);return j}
function desenharItens(){
 const f=$("filtro").value.trim().toLowerCase();
 const lista=itensAtuais.filter(i=>i.nome.toLowerCase().includes(f)).slice().reverse();
 $("contagem").textContent="("+lista.length+")";
 $("itens").innerHTML=lista.map(i=>`<div class="item"><input type="checkbox" class="marca" data-m="${i.id}" ${marcados.has(i.id)?"checked":""} aria-label="Marcar ${esc(i.nome)}"><div class="info"><div class="nome">${esc(i.nome)}${i.aberto?'<span class="badge">ABERTO</span>':""}</div><div class="ori" title="${esc(i.origem)}">${esc(i.origem)}</div><div class="meta">${tam(i.bytes_originais)} → ${tam(i.bytes_zip)} · ${i.arquivos} ${i.arquivos===1?"arquivo":"arquivos"} ·${dataBr(i.data)}</div></div><div class="acoes">${i.aberto?`<button class="sec" data-e="${i.id}">Abrir pasta</button><button data-f="${i.id}">Guardar de volta</button>`:`<button data-a="${i.id}">Abrir</button>`}<button class="sec perigo" data-x="${i.id}">Excluir</button></div></div>`).join("")||'<div class="vazio">Nada arquivado.</div>';desenharLote()}
function textoExclusao(lista){
 const abertos=lista.filter(i=>i.aberto),fechados=lista.filter(i=>!i.aberto);
 const linhas=["EXCLUIR DEFINITIVAMENTE (sem lixeira e sem volta):",""];
 if(fechados.length)linhas.push("Somente o ZIP: "+fechados.map(i=>i.nome).join(", "));
 if(abertos.length)linhas.push("PASTA ABERTA (com as alteracoes de agora) e ZIP: "+abertos.map(i=>i.nome).join(", "));
 return linhas.join("\n")}
function desenharLote(){
 const ids=new Set(itensAtuais.map(i=>i.id));
 for(const id of [...marcados])if(!ids.has(id))marcados.delete(id);
 const sel=itensAtuais.filter(i=>marcados.has(i.id));
 const fechadas=sel.filter(i=>!i.aberto),abertas=sel.filter(i=>i.aberto);
 $("lote").hidden=sel.length===0;
 $("qtdMarcadas").textContent=sel.length+(sel.length===1?" marcada":" marcadas");
 $("btnAbrirLote").textContent="Abrir marcadas ("+fechadas.length+")";
 $("btnAbrirLote").disabled=!fechadas.length;
 $("btnPastasLote").textContent="Abrir pastas ("+abertas.length+")";
 $("btnPastasLote").disabled=!abertas.length;
 $("btnGuardarLote").textContent="Guardar marcadas de volta ("+abertas.length+")";
 $("btnGuardarLote").disabled=!abertas.length;
 $("btnExcluirLote").textContent="Excluir marcadas ("+sel.length+")"}
async function lote(rota,filtro,limpar){
 $("msgLote").textContent="";
 for(const i of itensAtuais.filter(x=>marcados.has(x.id)&&filtro(x))){
  try{await api(rota,{id:i.id});if(limpar)marcados.delete(i.id)}catch(x){$("msgLote").textContent=i.nome+": "+x.message}}
 estado()}
function desenharJobs(jobs){
 const lista=jobs.slice().reverse().slice(0,6);
 $("jobs").innerHTML=lista.length?lista.map(j=>{
  const p=j.total?Math.round(j.feito/j.total*100):0;
  const cor=j.ok===true?"ok":j.ok===false?"er":"mut";
  return `<div style="margin:8px 0"><div class="row"><b>${esc(j.nome)}</b><span class="${cor}">${esc(j.fase)}${j.erro?": "+esc(j.erro):""}${j.liberado?" · liberou "+tam(j.liberado):""}</span></div><div class="bar"><i style="width:${j.ok===true?100:p}%"></i></div></div>`}).join("")+(lista.some(j=>j.ok===false)?'<button class="sec" data-d="1">Dispensar erros</button>':""):"Nada em andamento."}
async function estado(){
 const e=await api("/api/estado");
 $("topo").textContent="Livre no C: "+e.livre_gb+" GB · ZIPs em "+e.pasta;
 if(!$("raiz").options.length)e.raizes.forEach(r=>$("raiz").add(new Option(r,r)));
 itensAtuais=e.itens;desenharItens();desenharJobs(e.jobs)}
$("filtro").oninput=desenharItens;
$("btnVarrer").onclick=async()=>{
 $("statusVarrer").textContent="medindo...";
 const l=await api("/api/varrer?raiz="+$("raiz").value);
 $("statusVarrer").textContent="";
 $("sugestoes").innerHTML=l.map(x=>`<div class="item"><div class="info"><div class="nome">${esc(x.nome)}</div></div><div class="meta">${tam(x.bytes)}</div><div class="acoes"><button class="sec" data-c="${esc(x.caminho)}">Usar</button></div></div>`).join("")||'<div class="vazio">Nada para listar.</div>'};
document.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){$("caminho").value=b.dataset.c;$("caminho").focus();return}
 if(b.dataset.d){await api("/api/dispensar",{});estado();return}
 try{
  for(const [k,rota] of [["a","/api/abrir"],["f","/api/fechar"],["e","/api/explorer"]]){if(b.dataset[k])await api(rota,{id:b.dataset[k]})}
  if(b.dataset.x){const i=itensAtuais.find(x=>x.id===b.dataset.x);
  if(i&&confirm(textoExclusao([i])))await api("/api/excluir",{id:i.id})}
 }catch(x){$("msg").textContent=x.message}
 estado()});
$("btnCompactar").onclick=async()=>{
 $("msg").textContent="";
 try{await api("/api/compactar",{caminho:$("caminho").value.trim(),apagar:$("apagar").checked});$("caminho").value=""}catch(x){$("msg").textContent=x.message}
 estado()};
$("btnAbrirLote").onclick=()=>lote("/api/abrir",i=>!i.aberto,false);
$("btnPastasLote").onclick=()=>lote("/api/explorer",i=>i.aberto,false);
$("btnGuardarLote").onclick=()=>lote("/api/fechar",i=>i.aberto,true);
$("btnExcluirLote").onclick=()=>{
 const sel=itensAtuais.filter(i=>marcados.has(i.id));
 if(sel.length&&confirm(textoExclusao(sel)))lote("/api/excluir",()=>true,true)};
$("btnLimparLote").onclick=()=>{marcados.clear();desenharItens()};
document.addEventListener("change",e=>{
 const id=e.target.dataset&&e.target.dataset.m;
 if(id){if(e.target.checked)marcados.add(id);else marcados.delete(id);desenharLote()}});
estado();setInterval(estado,1500);
</script>
</body>
</html>
